<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Stroll</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="startScreen">
  <div class="title">Space Stroll</div>
  <div class="subtitle">Navigate the cosmos, catch the right words!</div>
  <button class="btn" onclick="startGame()">START</button>
</div>

<div id="victoryScreen" class="hidden">
  <div class="title" style="color:#5ac8fa;">🌟 Cosmic Champion! 🌟</div>
  <div class="subtitle">You mastered all the words!</div>
  <button class="btn" onclick="goToMenu()">Play Again</button>
</div>

<div id="gameOverScreen" class="hidden">
  <div style="font-size:48px;color:#ff6b8a;text-shadow:0 0 40px rgba(255,107,138,0.5);margin-bottom:16px;letter-spacing:4px;">GAME OVER</div>
  <div style="font-size:16px;color:#7a8aaa;margin-bottom:8px;">Your ship was destroyed!</div>
  <div style="font-size:24px;color:#e8d5b7;margin-bottom:40px;text-shadow:0 0 15px rgba(232,213,183,0.3);">Score: <span id="finalScore">0</span></div>
  <button class="btn" onclick="goToMenu()">Try Again</button>
</div>

<div id="hud" class="hidden">
  <div class="hud-box"><span class="level-badge level-1" id="levelText">Level 1</span></div>
  <div class="hud-box"><div class="progress-dots" id="progressDots"></div></div>
  <div class="hud-box">Score: <span id="scoreText">0</span></div>
</div>

<div id="healthBarContainer" class="hidden">
  <div id="healthBarBg"><div id="healthBarFill"></div></div>
  <div id="healthBarText">❤️❤️❤️</div>
</div>

<div id="powerupMsg" class="powerup-msg"></div>
<div id="controlsHint" class="controls-hint hidden">← → rotate &nbsp;|&nbsp; ↑ accelerate &nbsp;|&nbsp; ↓ brake &nbsp;|&nbsp; SPACE grapple</div>
<div id="grappleHint" class="grapple-hint">SPACE to fire!</div>

<canvas id="gameCanvas"></canvas>

<script src="script.js"></script>
</body>
</html>
